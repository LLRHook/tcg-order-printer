name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - run: cargo fmt --manifest-path tools/packager/Cargo.toml --check
      - run: cargo clippy --locked --offline --manifest-path tools/packager/Cargo.toml --all-targets -- -D warnings
      - run: npm run test:package
      - run: npm run package
